name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build.yml

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download Artifact
        uses: actions/download-artifact@v8
        with:
          name: Sura-AppImage

      - name: Extract Major Version
        id: get_major
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION_NUM="${TAG#v}"
          MAJOR="${VERSION_NUM%%.*}"
          echo "major=$MAJOR" >> $GITHUB_OUTPUT

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"

          # Find the exact previous semantic tag
          PREV_TAG=$(git tag -l 'v*' | sort -rV | grep -A 1 "^$TAG$" | tail -n 1)

          # If this is the very first tag, don't supply a start tag
          if [ "$PREV_TAG" = "$TAG" ] || [ -z "$PREV_TAG" ]; then
            NOTES_FLAG=""
          else
            NOTES_FLAG="--notes-start-tag $PREV_TAG"
          fi

          gh release create "$TAG" Sura-*.AppImage \
            --title "Sura v${{ steps.get_major.outputs.major }}" \
            --generate-notes $NOTES_FLAG

      - name: Keep 2 most recent releases per Major Version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAGS=$(git tag -l 'v*' | sort -rV)
          declare -A MAJOR_COUNTS

          for TAG in $TAGS; do
            VERSION_NUM="${TAG#v}"
            MAJOR="${VERSION_NUM%%.*}"

            if [ -z "${MAJOR_COUNTS[$MAJOR]}" ]; then
              MAJOR_COUNTS[$MAJOR]=0
            fi

            COUNT=${MAJOR_COUNTS[$MAJOR]}
            MAJOR_COUNTS[$MAJOR]=$((COUNT + 1))

            if [ ${MAJOR_COUNTS[$MAJOR]} -gt 2 ]; then
              echo "Deleting old release: $TAG (Major Version $MAJOR already has 2 newest releases)"
              gh release delete "$TAG" -y || true
              git push origin --delete "$TAG" || true
            else
              echo "Save release: $TAG (Major Version $MAJOR, newest release no. ${MAJOR_COUNTS[$MAJOR]})"
            fi
          done
