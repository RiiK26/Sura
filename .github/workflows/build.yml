name: Build

on:
  push:
    branches: [ "main" ]
  workflow_call:

jobs:
  build-appimage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libexiv2-dev libgl1-mesa-dev file libfuse2 libxcb-cursor0

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.5.0'

      - name: Build Sura
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Build AppImage
        run: |
          wget -c -nv "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage"
          wget -c -nv "https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage"
          chmod a+x linuxdeploy*.AppImage

          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/256x256/apps
          cp build/Sura AppDir/usr/bin/sura
          cp resources/images/icon.png AppDir/usr/share/icons/hicolor/256x256/apps/sura.png

          cp resources/sura.desktop AppDir/usr/share/applications/sura.desktop

          export VERSION=$(git describe --tags --always || echo "latest")
          export EXTRA_QT_PLUGINS=wayland,svg

          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --plugin qt \
            --output appimage \
            --desktop-file AppDir/usr/share/applications/sura.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/256x256/apps/sura.png

      - name: Upload AppImage Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Sura-AppImage
          path: Sura-*.AppImage
